[package]
name = "netupi"
version = "0.11.0"
edition = "2018"
default-run = "netupi"

[dependencies]
im = "15"
ical = { git = "https://github.com/migmedia/ical-rs", features=['ical', 'generator'] }
uuid = { version = "0.8", features = ["v1"] }
chrono = { version = "0.4" }
rodio = { version = "0.14" }
anyhow = "1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
dirs = "4.0"
csv = "1.1"
notify-rust = "4"
clap = { version = "3.0.5", features = ["derive"] }
ratatui = "0.26.1"
crossterm = "0.27.0"

[dependencies.rusqlite]
version = "0.26.0"
features = ["bundled"]
